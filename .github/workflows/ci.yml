name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute:
    name: compute layer (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Bundle the golden fixture and run the publish gate
        run: |
          python -m fable.compute bundle fable/tests/fixtures/golden_run \
            --workbook workbooks/FABLEPAKUP50.xlsx \
            --country Pakistan --baseline "Current Trends" \
            --out /tmp/bundle-out
        # exit code is non-zero if the gate rejects the bundle

  viewer:
    name: viewer (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
